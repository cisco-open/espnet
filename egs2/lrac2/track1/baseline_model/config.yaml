num_spk: 1
num_noise_type: 1
sample_rate: 24000
force_single_channel: true
channel_reordering: false
categories: []
speech_segment: null
avoid_allzero_segment: true
flexible_numspk: false
codec: vocodec
codec_conf:
    sampling_rate: 24000
    generator_params:
        hidden_dim: 176
        n_fft: 720
        hop_length: 240
        encoder_num_convnext_blocks: 6
        encoder_convnext_hidden_dim: 216
        decoder_num_convnext_blocks: 6
        decoder_convnext_hidden_dim: 200
        convnext_kernel_size: 7
        convnext_layer_scale_init_value: null
        posnet_num_blocks: 4
        posnet_kernel_size: 3
        encoder_posnet_groups:
        - 1
        - 1
        decoder_posnet_groups:
        -   - 1
            - 1
        -   - 1
            - 1
        -   - 2
            - 2
        -   - 2
            - 2
        posnet_dropout: 0.1
        attention_after: 2
        attention_heads: 4
        attention_context_frames: 300
        attention_lookahead_frames: 0
        attention_query_tile_size: 64
        attention_use_rope: true
        attention_rotary_dim: 44
        attention_rope_base: 10000.0
        latent_kernel_size: 3
        quantizer_codebook_dim: 8
        quantizer_n_q: 24
        quantizer_bins: 1024
        quantizer_dropout: 0.5
        quantizer_dropout_sampling: target_bandwidths
        quantizer_projection_mode: per_layer
        quantizer_projection_bias: true
        quantizer_projection_norm: weight_norm
        quantizer_normalized_lookup: true
        quantizer_loss_normalization: full_batch
        quantizer_target_bandwidth:
        - 1
        - 6
        - 12
        - 24
        max_magnitude: 100.0
    discriminator_params:
        msstft_discriminator_params:
            filters: 32
            in_channels: 1
            out_channels: 1
            sep_channels: false
            n_ffts:
            - 128
            - 256
            - 512
            - 1024
            - 2048
            hop_lengths:
            - 32
            - 64
            - 128
            - 256
            - 512
            win_lengths:
            - 128
            - 256
            - 512
            - 1024
            - 2048
            max_filters: 1024
            filters_scale: 1
            kernel_size:
            - 3
            - 9
            dilations:
            - 1
            - 2
            - 4
            stride:
            - 1
            - 2
            normalized: true
            norm: weight_norm
            activation: LeakyReLU
            activation_params:
                negative_slope: 0.2
    generator_adv_loss_params:
        average_by_discriminators: false
        loss_type: mse
    discriminator_adv_loss_params:
        average_by_discriminators: false
        loss_type: mse
    use_feat_match_loss: true
    feat_match_loss_params:
        average_by_discriminators: false
        average_by_layers: false
        include_final_outputs: true
    use_dual_decoder: false
    use_mel_loss: true
    mel_loss_params:
        range_start: 5
        range_end: 12
        window: hann
        n_mels:
        - 5
        - 10
        - 20
        - 40
        - 80
        - 160
        - 320
        fmin: 0
        fmax: null
        log_base: null
        alphas: false
        use_mse: false
        scale_reduction: sum
    lambda_mel: 15.0
    lambda_feat_match: 2.0
    lambda_adv: 2.0
    lambda_quantization: 1.0
    lambda_commit: 0.25
    lambda_reconstruct: 0.0
    cache_generator_outputs: true
    use_loss_balancer: false
required:
- output_dir
version: '202503'
distributed: true
