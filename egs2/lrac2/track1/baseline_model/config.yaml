    betas:
    - 0.8
    - 0.99
    eps: 1.0e-08
    weight_decay: 0.01
scheduler: cosineannealingwarmuprestarts
scheduler_conf:
    first_cycle_steps: 1000000
    cycle_mult: 1.0
    max_lr: 0.0003
    min_lr: 1.0e-06
    warmup_steps: 25000
    gamma: 1.0
optim2: adamw
optim2_conf:
    lr: 0.0003
    betas:
    - 0.8
    - 0.99
    eps: 1.0e-08
    weight_decay: 0.01
scheduler2: cosineannealingwarmuprestarts
scheduler2_conf:
    first_cycle_steps: 1000000
    cycle_mult: 1.0
    max_lr: 0.0003
    min_lr: 1.0e-06
    warmup_steps: 25000
    gamma: 1.0
generator_first: true
skip_discriminator_prob: 0
model_conf: {}
apply_enhancement: false
use_preprocessor: true
rir_scp: null
validation_rir_scp: null
